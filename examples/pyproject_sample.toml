[project]
name = "widgetlib"
version = "1.2.0"
description = "Widgets, but faster."
requires-python = ">=3.11"
dependencies = ["requests", "click"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
widgetlib = "widgetlib.cli:main"

[project.entry-points."widgetlib.plugins"]
csv = "widgetlib.plugins.csv:Plugin"

[project.urls]
Homepage = "https://example.com/widgetlib"
Docs = "https://example.com/widgetlib/docs"

[tool.ruff]
line-length = 100
