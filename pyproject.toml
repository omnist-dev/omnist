[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omnist"
version = "0.8.8"
description = "One data model, many formats: read, validate, and write JSON, YAML, TOML, XML, and OML."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Thomas Y. Lee" }]
keywords = ["schema", "validation", "json", "yaml", "toml", "xml", "data", "convert"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.scripts]
omnist = "omnist.cli:main"

[project.optional-dependencies]
yaml = ["pyyaml"]
toml = ["tomli_w"]          # writing TOML; reading uses stdlib tomllib (3.11+)
xml = ["defusedxml"]
all = ["pyyaml", "tomli_w", "defusedxml"]
dev = [
    "pytest~=9.1",
    "coverage~=7.0",
    "pyyaml~=6.0",
    "tomli_w~=1.2",
    "defusedxml~=0.7",
    "ruff~=0.15",
    "hypothesis~=6.155",
    "jsonschema~=4.26",
    "mypy~=2.1",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.0",
]

[project.urls]
Homepage = "https://github.com/omnist-dev/omnist"
Repository = "https://github.com/omnist-dev/omnist"
Issues = "https://github.com/omnist-dev/omnist/issues"
Changelog = "https://github.com/omnist-dev/omnist/blob/master/CHANGELOG.md"

[tool.pytest.ini_options]
# Restrict discovery to tests/ -- without this, pytest's default
# recursive discovery walks into vendor/omnist-spec (issue #283's
# submodule) and matches its self_test.py against pytest's own
# *_test.py collection pattern, trying to import a module that isn't on
# this repo's sys.path at all.
testpaths = ["tests"]

[tool.setuptools]
packages = ["omnist", "omnist.ops"]

[tool.setuptools.package-data]
omnist = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
# vendor/omnist-spec (issue #283's submodule) is a sibling repo's code,
# vendored for its fixtures -- not ours to lint or reformat.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E701", "E702"]  # this codebase uses ; and one-line class/def bodies (osd.py, examples)
