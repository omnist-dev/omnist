name: Bench

on:
  schedule:
    # Weekly, Monday 06:00 UTC. Non-gating: this workflow never fails the
    # build on slow numbers -- see docs/stability.md#stable-surfaces.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python3 tools/bench_smoke.py
