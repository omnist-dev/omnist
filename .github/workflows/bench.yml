name: Bench

on:
  schedule:
    # Weekly, Monday 06:00 UTC. Non-gating: this workflow never fails the
    # build on slow numbers -- see docs/stability.md#stable-surfaces.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python3 tools/bench_smoke.py
